[package]
name = "ardu-deck"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ardu_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ascii = "1.1.0"
serial2 = "0.2.37"
zerocopy = {version="0.9.0-alpha.0", features = ["derive"] }
enigo = "0.6.1"
# libobs-wrapper = "9.0.4"
twitch_oauth_token = "4.4.0"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2.0.0", features = ["deep-link"] }
discord-rich-presence = "1.1.0"
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
reqwest = { version = "0.13.4", features = ["json"] }
tauri-plugin-store = "2"
dotenvs = "0.2.2"
twitch_api = {version="0.8.0", features = ["twitch_oauth2", "reqwest", "client", "helix", "eventsub"] }
tokio = "1.53.1"
tokio-tungstenite = {version = "0.30.0", features = ["native-tls", "url"] }
futures = "0.3.34"
